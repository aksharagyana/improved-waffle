name: Build and Push Docker Images

on:
  schedule:
    - cron: '0 2 * * 6'  # Every Saturday at 2:00 UTC
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      cachebust:
        description: "Optional CACHEBUST override for Docker builds"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      cachebust: ${{ steps.values.outputs.cachebust }}
      datetag: ${{ steps.values.outputs.datetag }}
      push: ${{ steps.values.outputs.push }}
    steps:
      - name: Resolve build values
        id: values
        run: |
          if [[ -n "${{ inputs.cachebust || '' }}" ]]; then
            cachebust="${{ inputs.cachebust }}"
          else
            cachebust="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          fi

          datetag="$(date +%y%m%d%H%M%S)"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            push="false"
          else
            push="true"
          fi

          echo "Using CACHEBUST=${cachebust}"
          echo "Using date tag=${datetag}"
          echo "Pushing images=${push}"
          echo "cachebust=${cachebust}" >> "${GITHUB_OUTPUT}"
          echo "datetag=${datetag}" >> "${GITHUB_OUTPUT}"
          echo "push=${push}" >> "${GITHUB_OUTPUT}"

  build:
    name: build ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: py
            dockerfile: dockeroptimised/Dockerfile.python
            platforms: linux/amd64,linux/arm64
          - image: node
            dockerfile: dockeroptimised/Dockerfile.node
            platforms: linux/amd64,linux/arm64
          - image: go
            dockerfile: dockeroptimised/Dockerfile.go
            platforms: linux/amd64,linux/arm64
          - image: debianazsql
            dockerfile: dockeroptimised/Dockerfile.debianazsql
            platforms: linux/amd64,linux/arm64
          - image: dotnet
            dockerfile: dockeroptimised/Dockerfile.dotnet
            platforms: linux/amd64,linux/arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: needs.prepare.outputs.push == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Resolve image tags
      id: tags
      run: |
        repo="${GITHUB_REPOSITORY,,}"
        image="ghcr.io/${repo}/${{ matrix.image }}"
        {
          echo "image=${image}"
          echo "tags<<EOF"
          echo "${image}:${{ needs.prepare.outputs.datetag }}"
          echo "${image}:latest"
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    - name: Build ${{ matrix.image }}
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: ${{ matrix.platforms }}
        push: ${{ needs.prepare.outputs.push == 'true' }}
        tags: ${{ steps.tags.outputs.tags }}
        build-args: |
          CACHEBUST=${{ needs.prepare.outputs.cachebust }}
        secrets: |
          GITHUB_TOKEN=${{ github.token }}
        cache-from: type=gha,scope=${{ matrix.image }}
        cache-to: type=gha,mode=max,scope=${{ matrix.image }}
